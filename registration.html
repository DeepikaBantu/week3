<html>
<head>
<title>
REGISTRATION FORM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form>
<h1> REGISTER </h1>
<p>please fill the below form.</p>
<hr><label for="name"><b>User Name:</b></label>
<input type="text" placeholder="enter name" name="name" id="name" required>
<br>
<label for="gender"><b>Gender:</b></label>
<input type="radio" name="gender" id="male" value="male" required>
<label for="male">male</label>
<input type="radio" name="gender" id="female" value="female" required>
<label for="female">female</label>
<br>
<label for="phone"><b>Phone no. :</b></label>
<input type="tel" placeholder="enter phone number" name="phone" id="phone" pattern="[0-9]{10}" required>
<br>
<label for="address"><b>Address:</b></label>
<textarea name="address" placeholder="enter address"  id="address" required></textarea>
<br>
<label for="email"><b>Email:</b></label>
<input type="email" placeholder="enter email" name="email" id="email" required>
<br>
<label for="psw"><b>password:</b></label>
<input type="password" placeholder="enter password" name="psw" id="psw" required>
<br>
<label for="repeat_psw"><b>Repeat password:</b></label>
<input type="password" placeholder="confirm password" name="repeat_psw" id="repeat_psw" required>
<br>
<hr>
<br>
<p>By creating an account you are agree to our<a href="#">Terms and privacy</a></p><br>
<button type="submit">Register</button>
<p>Already have an account?<a href="#">sign in</a>
</p></form>
</body>
</html>
